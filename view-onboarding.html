<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NGU — Onboarding Review Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        :root {
            --primary: #005EB8; --accent: #00A3E0;
            --bg-dark: #0A1628; --bg-card: #1a2942; --bg-input: #0d1f3a;
            --text-light: #E8EDF2; --text-muted: #8B9AAE; --border: #2a3f5f;
            --success: #10B981; --error: #EF4444; --warning: #F59E0B;
            --sidebar-width: 340px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Work Sans', sans-serif; background: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; overflow: hidden; }
        
        .sidebar { width: var(--sidebar-width); background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); background: #111d31; }
        .logo { max-height: 40px; display: block; margin-bottom: 1rem; }
        .sidebar-header h2 { font-size: 1.2rem; color: var(--accent); }
        
        .search-wrap { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg-dark); }
        .search-input-row { display: flex; align-items: center; gap: 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; transition: border-color 0.2s; }
        .search-input-row:focus-within { border-color: var(--accent); }
        .search-input-row input { flex: 1; background: none; border: none; outline: none; color: var(--text-light); font-family: inherit; font-size: 0.88rem; padding: 0.6rem 0; }
        
        .applicant-list { flex: 1; overflow-y: auto; padding: 1rem; }
        .applicant-item { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .applicant-item:hover, .applicant-item.active { border-color: var(--accent); background: rgba(0, 163, 224, 0.1); }
        .app-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.2rem; }
        .app-pos { font-size: 0.85rem; color: var(--accent); margin-bottom: 0.4rem; }
        
        .status-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 5px; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
        .status-submitted { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-processed { background: rgba(0, 163, 224, 0.15); color: var(--accent); border: 1px solid rgba(0, 163, 224, 0.4); }

        .main-content { flex: 1; overflow-y: auto; padding: 2rem 3rem; background: linear-gradient(135deg, var(--bg-dark) 0%, #0d1f3a 100%); }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 1.2rem; }
        
        .app-header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; }
        .app-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .app-header .role-badge { display: inline-block; background: rgba(0,163,224,0.15); color: var(--accent); padding: 0.4rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .agency-badge-large { display: inline-flex; align-items: center; gap: 5px; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.45); color: #fcd34d; padding: 0.35rem 0.9rem; border-radius: 20px; font-weight: 700; font-size: 0.82rem; white-space: nowrap; vertical-align: middle; margin-left: 0.6rem; }
        .referral-badge-large { display: inline-flex; align-items: center; gap: 5px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; padding: 0.35rem 0.9rem; border-radius: 20px; font-weight: 700; font-size: 0.82rem; white-space: nowrap; vertical-align: middle; margin-left: 0.6rem; }
        
        .section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.8rem; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .section h3 { font-size: 1.2rem; color: var(--accent); margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 8px;}
        
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem 2rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem 2rem; }
        
        .data-group { margin-bottom: 1rem; }
        .data-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; font-weight: 600; }
        .data-value { font-size: 1rem; color: var(--text-light); word-break: break-word; }
        .data-value.mono { font-family: 'DM Mono', monospace; font-size: 1.1rem; letter-spacing: 0.05em; color: white; }
        
        .missing-data { color: var(--warning); font-style: italic; font-size: 0.9rem; font-weight: 500; }
        .signature-img { max-height: 80px; background: white; padding: 5px; border-radius: 4px; border: 1px solid var(--border); margin-top: 5px; }

        .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 700; transition: all 0.2s; cursor: pointer; }
        .btn-action:hover { background: rgba(16, 185, 129, 0.2); transform: translateY(-2px); }

        .btn-download { display: inline-flex; align-items: center; justify-content: center; background: rgba(0, 163, 224, 0.1); border: 1px solid rgba(0, 163, 224, 0.4); color: var(--accent); padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: all 0.2s; margin-top: 0.5rem;}
        .btn-download:hover { background: rgba(0, 163, 224, 0.2); }

        .btn-hmrc { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 163, 224, 0.12); border: 1px solid var(--accent); color: var(--accent); padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-decoration: none; cursor: pointer; transition: all 0.2s; }
        .btn-hmrc:hover { background: rgba(0, 163, 224, 0.22); transform: translateY(-1px); }

        /* ── Contract button ── */
        .btn-contract { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.12); border: 1px solid var(--success); color: #6ee7b7; padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-contract:hover { background: rgba(16, 185, 129, 0.22); transform: translateY(-1px); }
        .reissue-panel { margin-top: 1.5rem; padding: 1rem 1.2rem; border: 1px dashed var(--warning); border-radius: 10px; background: rgba(245, 158, 11, 0.06); }
        .reissue-panel .reissue-row { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: flex-end; margin-top: 0.6rem; }
        .reissue-panel input[type="date"] { background: var(--bg-input); color: white; border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.9rem; outline: none; }
        .btn-reissue { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: #fcd34d; padding: 0.55rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-reissue:hover:not(:disabled) { background: rgba(245, 158, 11, 0.28); }
        .btn-reissue:disabled { opacity: 0.6; cursor: not-allowed; }
        /* Sidebar tabs (Active / Archive) */
        .list-tabs { display: flex; gap: 6px; padding: 0.75rem 1.5rem 0; background: var(--bg-dark); }
        .list-tabs button { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 7px 10px; border-radius: 6px; font-family: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .list-tabs button.active { background: rgba(0,163,224,0.15); border-color: var(--accent); color: var(--accent); }
        .status-archived { background: rgba(139,154,174,0.15); color: #cbd5e1; }
        .status-approval { background: rgba(245,158,11,0.15); color: #fcd34d; }
        /* Document verification stamps */
        .doc-stamp { display: block; margin-top: 3px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        .doc-stamp.ok { color: #6ee7b7; }
        .doc-stamp.bad { color: #fca5a5; }
        .rejected-banner { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; padding: 0.9rem 1.1rem; border-radius: 8px; margin-bottom: 1.2rem; font-size: 0.9rem; line-height: 1.5; }
        .rejected-banner button, .approval-panel button, .archive-panel button, .rtw-panel button { cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 6px; padding: 0.5rem 0.9rem; font-size: 0.82rem; }
        .rtw-panel { background: rgba(0,163,224,0.05); border: 1px solid rgba(0,163,224,0.3); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.4rem; }
        .rtw-panel select { color: white; border: 1px solid var(--border); padding: 6px; border-radius: 6px; font-size: 0.85rem; }
        .approval-panel { margin-top: 1.5rem; padding: 1rem 1.2rem; border-radius: 10px; border: 1px solid var(--warning); background: rgba(245,158,11,0.06); }
        .approval-panel.approved { border-color: var(--success); background: rgba(16,185,129,0.07); }
        .btn-approve { background: rgba(16,185,129,0.18); border: 1px solid var(--success); color: #6ee7b7; }
        .btn-approve:hover { background: rgba(16,185,129,0.3); }
        .btn-muted { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .archive-panel { margin-top: 1.5rem; padding: 1rem 1.2rem; border: 1px dashed var(--border); border-radius: 10px; background: rgba(0,0,0,0.15); }
        .archive-panel .archive-row { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: flex-end; margin-top: 0.6rem; }
        .archive-panel input { background: var(--bg-input); color: white; border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.9rem; }
        .btn-leaver { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.5); color: #fca5a5; }
        .btn-dns { background: rgba(139,154,174,0.12); border: 1px solid var(--text-muted); color: #cbd5e1; }
        .archived-banner { background: rgba(139,154,174,0.1); border: 1px solid var(--text-muted); color: #e2e8f0; padding: 1rem 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .reissue-pending { margin-bottom: 1rem; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--warning); background: rgba(245, 158, 11, 0.1); color: #fcd34d; font-size: 0.9rem; font-weight: 600; }
        .contract-history-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 1rem; margin-top: 0.6rem; font-size: 0.85rem; color: var(--text-light); }
        .contract-history-item img { max-height: 40px; background: #fff; border-radius: 3px; padding: 3px; margin-top: 6px; display: block; }
        
        .banner-warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); padding: 1rem; border-radius: 8px; color: #fcd34d; margin-bottom: 1.5rem; font-weight: 600; }
        .doc-item { background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; }

        .holiday-chip { display: inline-block; background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; margin-right: 8px; margin-bottom: 8px; }

        /* ── Contract overlay ── */
        #contractOverlay .contract-doc {
            font-family: Georgia, 'Times New Roman', serif;
            color: #111;
            font-size: 13.5px;
            line-height: 1.7;
        }
        #contractOverlay h1 { font-size: 22px; margin-bottom: 6px; text-align: center; }
        #contractOverlay .contract-meta { text-align: center; font-size: 12px; color: #555; margin-bottom: 24px; border-bottom: 2px solid #000; padding-bottom: 12px; }
        #contractOverlay .contract-body { white-space: pre-wrap; word-break: break-word; }
        #contractOverlay .signature-section {
            margin-top: 40px;
            border-top: 2px solid #000;
            padding-top: 24px;
        }
        #contractOverlay .sig-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 16px;
        }
        #contractOverlay .sig-field-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 4px;
        }
        #contractOverlay .sig-field-value {
            border-bottom: 1px solid #999;
            padding: 4px 2px;
            min-height: 22px;
            font-weight: 700;
            font-size: 13px;
        }
        #contractOverlay .sig-image-wrap {
            margin-top: 12px;
        }
        #contractOverlay .accepted-banner {
            background: #e6f9f0;
            border: 1px solid #10B981;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 12px;
            color: #065f46;
            font-weight: 700;
            margin-top: 14px;
            display: inline-block;
        }
        select {
            background: var(--bg-input) !important;
            color: var(--text-light) !important;
        }
        select option {
            background: var(--bg-card) !important;
            color: var(--text-light) !important;
        }
        @media print {
            html, body { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; }
            body > *:not(#contractOverlay):not(#hmrcOverlay) { display: none !important; }
            #contractOverlay { position: static !important; display: block !important; background: #fff !important; padding: 0 !important; }
            #contractOverlay .contract-sheet { max-height: none !important; overflow: visible !important; border-radius: 0 !important; max-width: none !important; width: auto !important; }
            #contractOverlay .contract-toolbar { display: none !important; }
            #contractOverlay .lh-table thead { display: table-header-group; }
            #contractOverlay .lh-table tfoot { display: table-footer-group; }
            #contractOverlay .lh-header, #contractOverlay .lh-footer { -webkit-print-color-adjust: exact; print-color-adjust: exact; page-break-inside: avoid; }
            #contractOverlay .lh-table { height: 268mm; }
            #contractOverlay .lh-table > thead > tr, #contractOverlay .lh-table > tfoot > tr { height: 1px; }
            #contractOverlay .lh-table > tbody > tr { height: auto; }
            #contractOverlay .lh-table > tbody > tr > td { vertical-align: top; height: 100%; }
            #contractOverlay .lh-header, #contractOverlay .lh-footer { padding-left: 14px !important; padding-right: 14px !important; }
            #contractOverlay .lh-body { padding-left: 14px !important; padding-right: 14px !important; }
            #contractOverlay .lh-footer { font-size: 10px !important; }
            #contractOverlay .lh-footer-row { flex-wrap: nowrap !important; gap: 10px !important; }
            #contractOverlay .lh-tagline { white-space: normal !important; }
            @page { size: A4; margin: 8mm; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="https://www.dropbox.com/scl/fi/kkujm1u6y7vvnp7luq8d7/ngu-main-white.png?rlkey=kgq2uh48qh4xssh4vlbz868lr&raw=1" alt="NGU Logo" class="logo">
            <h2>Onboarding Review Hub</h2>
            <a href="view-applications.html" style="display:inline-block; margin-top:0.5rem; color:var(--accent); text-decoration:none; font-size:0.85rem; font-weight:600; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent); transition: all 0.2s;" onmouseover="this.style.background='rgba(0,163,224,0.1)'" onmouseout="this.style.background='transparent'">&larr; Switch to Applicant Portal</a>
        </div>
        
        <div class="search-wrap">
            <div class="search-input-row">
                🔍 <input type="text" id="nameSearch" placeholder="Search onboardings…" autocomplete="off">
            </div>
        </div>

        <div class="list-tabs">
            <button type="button" id="tabActive" class="active">Active</button>
            <button type="button" id="tabArchive">Archive <span id="archiveCount"></span></button>
        </div>

        <div class="applicant-list" id="applicantList">
            <div class="empty-state" style="font-size: 1rem;">Loading records...</div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="empty-state">Select an onboarding profile from the sidebar to review details.</div>
    </main>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, query, onSnapshot, where, doc, updateDoc, getDocs, getDoc, deleteField, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    const firebaseConfig = {
        apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain: "oesperformance-a54c0.firebaseapp.com",
        projectId: "oesperformance-a54c0",
        storageBucket: "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId: "1:484894102454:web:17535ee497eac2d90d6717"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // ── EmailJS (used to tell a candidate their contract has been reissued) ──
    const EMAILJS_PUBLIC_KEY = 'ziLnha91scpGjFABh';
    const EMAILJS_SERVICE_ID = 'service_dcdbhph';
    // EmailJS template for the "contract reissued" email.
    // Template variables sent: to_email, first_name, job_title, previous_start_date,
    // new_start_date, portal_link, username, password
    const EMAILJS_CONTRACT_REISSUE = 'template_9cnewsa';
    if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    // EmailJS template sent automatically when a document is rejected.
    // Variables sent: to_email, first_name, job_title, rejected_items (HTML list),
    // rejected_items_text (plain text list), upload_link
    const EMAILJS_DOCS_REJECTED = 'template_709wmtm';
    const PORTAL_BASE = 'https://ngu-recruitment-portal.vercel.app';

    const DOC_LABELS = {
        passport: 'Passport / ID', idphoto: 'ID Headshot', dlfront: 'Driving Licence (Front)', dlback: 'Driving Licence (Back)',
        poa: 'Proof of Address', niproof: 'Proof of NI Number (Payslip/Card)', p45: 'P45 Document',
        mocopa: 'Level 3 Power / Smart Meter / Electric MOCOPA', gasl3: 'Level 3 Gas / City & Guilds / CMA / CCN',
        cmagas: 'CMA Gas Certificate', met1: 'MET1 Certificate', higherskills: 'Higher Skills Set Certificates',
        sharecode: 'Right to Work Share Code'
    };
    const DEFAULT_REJECT_REASON = 'This document could not be accepted. Please upload a clear, valid copy.';
    const currentUserName = () => localStorage.getItem('ngu_portal_username') || 'Admin';
    let currentTab = 'active';

    let applicationsData = [];
    let referralData = [];
    let interviewsData = [];
    let searchQuery = '';
    let selectedAppId = null;

    // Load referral submissions once so we can match by email
    getDocs(collection(db, "NGU Referral submissions")).then(snap => {
        referralData = snap.docs.map(d => d.data());
    });

    // Watch interview records so the Annual Leave answer given at interview
    // stage can be shown alongside onboarding, matched to the applicant by email.
    onSnapshot(collection(db, "NGU Interview Times"), (snapshot) => {
        interviewsData = [];
        snapshot.forEach(doc => interviewsData.push({ id: doc.id, ...doc.data() }));
        if (selectedAppId) {
            const updatedApp = applicationsData.find(a => a.id === selectedAppId);
            if (updatedApp) renderDetails(updatedApp);
        }
    });

    function setTab(tab) { currentTab = tab; renderSidebar(); }
    document.getElementById('tabActive').addEventListener('click', () => setTab('active'));
    document.getElementById('tabArchive').addEventListener('click', () => setTab('archive'));

    document.getElementById('nameSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderSidebar();
    });

    // Fetch applicants who have accepted their contract OR completed onboarding.
    // (Some applicants complete onboarding directly without contractAccepted being set)
    onSnapshot(collection(db, "NGUO New Applicants"), (snapshot) => {
        applicationsData = [];
        snapshot.forEach(doc => {
            const d = { id: doc.id, ...doc.data() };
            // Also keep applicants whose contract has been reissued and is awaiting a new signature
            if (d.contractAccepted === true || d.onboardingCompleted === true || (d.contractReissuedAt && d.contractAccepted === false)) {
                applicationsData.push(d);
            }
        });
        
        applicationsData.sort((a, b) => {
            if (a.onboardingProcessed && !b.onboardingProcessed) return 1;
            if (!a.onboardingProcessed && b.onboardingProcessed) return -1;
            if (a.onboardingCompleted && !b.onboardingCompleted) return -1;
            if (!a.onboardingCompleted && b.onboardingCompleted) return 1;
            return 0;
        });

        renderSidebar();
        
        if (selectedAppId) {
            const updatedApp = applicationsData.find(a => a.id === selectedAppId);
            if (updatedApp) renderDetails(updatedApp);
        }
    });

    function renderSidebar() {
        const listEl = document.getElementById('applicantList');
        listEl.innerHTML = '';

        const archivedCount = applicationsData.filter(a => a.onboardingArchive && a.onboardingArchive.status).length;
        document.getElementById('archiveCount').textContent = archivedCount ? `(${archivedCount})` : '';
        document.getElementById('tabActive').classList.toggle('active', currentTab === 'active');
        document.getElementById('tabArchive').classList.toggle('active', currentTab === 'archive');

        let filteredApps = applicationsData.filter(a => {
            const isArchived = !!(a.onboardingArchive && a.onboardingArchive.status);
            return currentTab === 'archive' ? isArchived : !isArchived;
        });
        if (searchQuery) {
            filteredApps = filteredApps.filter(app => {
                const name = app.fullName || `${app.personalDetails?.forename || ''} ${app.personalDetails?.surname || ''}`;
                return name.toLowerCase().includes(searchQuery);
            });
        }

        if (filteredApps.length === 0) {
            listEl.innerHTML = `<div class="empty-state" style="font-size: 0.9rem;">${currentTab === 'archive' ? 'Nothing in the archive.' : 'No active onboardings found.'}</div>`;
            return;
        }

        filteredApps.forEach((app) => {
            let statusBadge = '';
            if (app.onboardingArchive && app.onboardingArchive.status) {
                const arc = app.onboardingArchive;
                statusBadge = `<span class="status-badge status-archived">${arc.status === 'Leaver' ? '🚪 Leaver' : '🚫 Did not start'}${arc.date ? ' · ' + new Date(arc.date).toLocaleDateString('en-GB') : ''}</span>`;
            } else if (app.contractReissuedAt && app.contractAccepted === false) {
                statusBadge = `<span class="status-badge status-pending">🔄 Awaiting Re-Sign</span>`;
            } else if (app.onboardingProcessed) {
                statusBadge = `<span class="status-badge status-processed">✓ HR Processed</span>`;
            } else if (app.onboardingCompleted) {
                statusBadge = `<span class="status-badge status-submitted">🟢 Data Submitted</span>`;
            } else {
                statusBadge = `<span class="status-badge status-pending">🟡 Pending Forms</span>`;
            }

            if (!(app.onboardingArchive && app.onboardingArchive.status) && app.contractAccepted === true && !app.contractApproved) {
                statusBadge += ` <span class="status-badge status-approval">📝 Contract awaiting approval</span>`;
            }

            const div = document.createElement('div');
            div.className = 'applicant-item';

    function safeVal(val) { 
        return val ? val : `<span class="missing-data">Awaiting submission</span>`; 
    }

    // ─── REISSUE CONTRACT (start date changed) ───────────────────────────────
    // Saves the new start date, files the currently signed contract in
    // `contractHistory`, clears the live signature so the candidate has to
    // re-sign, and emails them. The candidate signs again via engineer-portal.html,
    // which shows the contract populated with the NEW start date.
    window.reissueContract = async function(appId, btnEl) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return alert('Applicant record not found. Please refresh and try again.');

        const newDate = document.getElementById('reissueStartDate')?.value;
        if (!newDate) return alert('Please choose the new start date first.');
        if (newDate === appData.startDate) return alert('That is already the start date on this contract. Choose a different date to reissue.');

        const fmtLong = (d) => d ? new Date(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
        const candidateName = appData.fullName || `${appData.personalDetails?.forename || ''} ${appData.personalDetails?.surname || ''}`.trim() || 'this candidate';

        if (!confirm(
            `Reissue the contract for ${candidateName}?\n\n` +
            `Start date: ${fmtLong(appData.startDate)}  →  ${fmtLong(newDate)}\n\n` +
            `• Their current signed contract is kept in the history below.\n` +
            `• Their signature is cleared and they must re-sign the new contract.\n` +
            `• ${EMAILJS_CONTRACT_REISSUE ? 'They will be emailed their login and the new start date.' : 'No email template is configured, so you will need to tell them yourself.'}\n\n` +
            `Continue?`
        )) return;

        const by = localStorage.getItem('ngu_portal_username') || 'Admin';
        const nowIso = new Date().toISOString();
        const updates = {
            startDate: newDate,
            previousStartDate: appData.startDate || '',
            contractAccepted: false,
            offerAccepted: false,
            contractAcceptedAt: deleteField(),
            offerAcceptedAt: deleteField(),
            contractSignature: deleteField(),
            contractSignName: deleteField(),
            contractReissuedAt: nowIso,
            contractReissuedBy: by,
            contractReissueCount: (appData.contractReissueCount || 0) + 1,
            // a reissued contract has to be approved again once re-signed
            contractApproved: false,
            contractApprovedAt: deleteField(),
            contractApprovedBy: deleteField(),
            contractApprovalNote: deleteField()
        };
        // Keep the superseded contract on file (only if there was a signed one to keep)
        if (appData.contractAccepted === true) {
            updates.contractHistory = arrayUnion({
                startDate: appData.startDate || '',
                contractAcceptedAt: appData.contractAcceptedAt || '',
                contractSignName: appData.contractSignName || '',
                contractSignature: appData.contractSignature || '',
                contractApprovedAt: appData.contractApprovedAt || '',
                contractApprovedBy: appData.contractApprovedBy || '',
                supersededAt: nowIso,
                supersededBy: by,
                reason: 'Start date changed'
            });
        }

        if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Reissuing…'; }

        try {
            await updateDoc(doc(db, "NGUO New Applicants", appId), updates);
        } catch (e) {
            console.error('Reissue contract error:', e);
            alert('Could not reissue the contract. Please check your connection and try again.');
            if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🔄 Reissue Contract'; }
            return;
        }

        // Email the candidate. A failure here must not undo the reissue.
        const result = await sendReissueEmail(appData, appData.startDate, newDate);
        const emailNote = result.ok
            ? '\n\nThe candidate has been emailed.'
            : `\n\nThe contract was reissued, but the email was NOT sent:\n${result.error}\n\nUse the "Resend email" button on this applicant once that is fixed, or tell the candidate yourself.`;

        alert('Contract reissued. The candidate must now re-sign with the new start date.' + emailNote);
    };

    // Sends the "contract reissued" email and records the outcome on the applicant
    // record, so a failed send is visible later and can be retried.
    async function sendReissueEmail(appData, previousStartDate, newStartDate) {
        const fmtLong = (d) => d ? new Date(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
        const toEmail = appData.personalDetails?.email;
        let result = { ok: false, error: '' };

        if (!EMAILJS_CONTRACT_REISSUE) {
            result.error = 'No EmailJS template ID is set in this page (EMAILJS_CONTRACT_REISSUE is blank).';
        } else if (!window.emailjs) {
            result.error = 'The EmailJS library did not load (check the internet connection / ad-blocker).';
        } else if (!toEmail) {
            result.error = 'There is no email address on file for this candidate.';
        } else {
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_CONTRACT_REISSUE, {
                    to_email: toEmail,
                    first_name: (appData.fullName || appData.personalDetails?.forename || 'there').split(' ')[0],
                    job_title: appData.position || 'the role',
                    previous_start_date: fmtLong(previousStartDate),
                    new_start_date: fmtLong(newStartDate),
                    portal_link: 'https://ngu-recruitment-portal.vercel.app/engineer-portal.html',
                    username: appData.portalUsername || '',
                    password: appData.portalPassword || ''
                }, { publicKey: EMAILJS_PUBLIC_KEY });
                result.ok = true;
            } catch (e) {
                console.error('Reissue email error:', e);
                // EmailJS errors look like { status: 422, text: "The recipients address is empty" }
                result.error = `${e?.status ? 'EmailJS error ' + e.status + ': ' : ''}${e?.text || e?.message || e}`;
            }
        }

        try {
            await updateDoc(doc(db, "NGUO New Applicants", appData.id), {
                contractReissueEmail: {
                    status: result.ok ? 'sent' : 'failed',
                    at: new Date().toISOString(),
                    to: toEmail || '',
                    error: result.ok ? '' : result.error
                }
            });
        } catch (e) { console.error('Could not record reissue email outcome:', e); }

        return result;
    }

    window.resendReissueEmail = async function(appId, btnEl) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return alert('Applicant record not found. Please refresh and try again.');
        if (!confirm(`Resend the "contract reissued" email to ${appData.personalDetails?.email || 'this candidate'}?`)) return;
        if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Sending…'; }
        const result = await sendReissueEmail(appData, appData.previousStartDate || appData.startDate, appData.startDate);
        if (btnEl) { btnEl.disabled = false; btnEl.textContent = '📧 Resend email'; }
        alert(result.ok ? 'Email sent to the candidate.' : `The email was NOT sent:\n${result.error}`);
    };

    // ─── SIGNED CONTRACT VIEWER ───────────────────────────────────────────────

    // Replaces all {{placeholder}} merge fields with applicant data
    function populateContract(rawText, app) {
        const pd  = app.personalDetails  || {};
        const od  = app.onboardingDetails || {};

        const fullName    = app.fullName || `${od.firstName || pd.forename || ''} ${od.lastName || pd.surname || ''}`.trim() || '';
        const title       = od.title || pd.title || '';
        const address     = od.address  || pd.address  || '';
        const postcode    = od.postcode || pd.postcode || '';
        const position    = app.position || '';
        const startDate   = app.startDate
            ? new Date(app.startDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
            : 'TBC';
        const currentDate = app.contractAcceptedAt
            ? new Date(app.contractAcceptedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
            : new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

        // Build the signature block HTML to replace {{declaration.signature}} / {{declaration.date}}
        const signName = app.contractSignName || fullName;
        const signDate = app.contractAcceptedAt
            ? new Date(app.contractAcceptedAt).toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' })
            : 'Unknown';
        const sigImgHtml = app.contractSignature
            ? `<img src="${app.contractSignature}" style="display:block; max-height:70px; border:1px solid #ccc; padding:5px; background:#fff; margin-top:6px; border-radius:3px;">`
            : `<span style="font-size:12px; color:#888; font-style:italic;">No digital signature image on file.</span>`;

        // Replace each placeholder — order matters (longer paths first to avoid partial matches)
        return rawText
            .replace(/\{\{personalDetails\.title\}\}/g,   escapeHtml(title))
            .replace(/\{\{personalDetails\.address\}\}/g, escapeHtml(address))
            .replace(/\{\{personalDetails\.postcode\}\}/g,escapeHtml(postcode))
            .replace(/\{\{fullName\}\}/g,                 escapeHtml(fullName))
            .replace(/\{\{startDate\}\}/g,                escapeHtml(startDate))
            .replace(/\{\{current_date\}\}/g,             escapeHtml(currentDate))
            .replace(/\{\{position\}\}/g,                 escapeHtml(position))
            // Signature placeholders — inject actual HTML (not escaped)
            .replace(/\{\{declaration\.signature\}\}/g,   `__SIG_IMG__`)
            .replace(/\{\{declaration\.date\}\}/g,        escapeHtml(signDate));
        // __SIG_IMG__ will be swapped for real HTML after escaping is done on surrounding text
    }

    window.viewSignedContract = async function(appId) {
        const app = applicationsData.find(a => a.id === appId);
        if (!app) return;

        // Remove any existing overlay
        const existing = document.getElementById('contractOverlay');
        if (existing) existing.remove();

        // Show loading overlay while we fetch the contract
        const loadingOverlay = document.createElement('div');
        loadingOverlay.id = 'contractOverlay';
        loadingOverlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; display:flex; align-items:center; justify-content:center; padding:30px;';
        loadingOverlay.innerHTML = `<div style="background:#fff; color:#111; border-radius:8px; padding:40px; text-align:center; font-family:Georgia,serif;">
            <div style="font-size:1.5rem; margin-bottom:1rem;">⏳</div>
            <div style="font-size:1rem; color:#333;">Loading contract…</div>
        </div>`;
        document.body.appendChild(loadingOverlay);

        try {
            // Fetch matching contract from NGU Contacts & Policies
            const position = (app.position || '').trim();
            const contractsRef = collection(db, "NGU Contacts & Policies");
            const qContracts = query(contractsRef, where("type", "==", "contract"));
            const snap = await getDocs(qContracts);

            let contractContent = null;
            let contractJobTitle = null;

            // Exact match first (case-insensitive)
            snap.forEach(d => {
                const data = d.data();
                if (!contractContent && data.jobTitle?.toLowerCase().trim() === position.toLowerCase()) {
                    contractContent = data.content;
                    contractJobTitle = data.jobTitle;
                }
            });
            // Fallback: partial match
            if (!contractContent) {
                snap.forEach(d => {
                    const data = d.data();
                    if (!contractContent && (
                        position.toLowerCase().includes(data.jobTitle?.toLowerCase()) ||
                        data.jobTitle?.toLowerCase().includes(position.toLowerCase())
                    )) {
                        contractContent = data.content;
                        contractJobTitle = data.jobTitle;
                    }
                });
            }

            loadingOverlay.remove();

            const computedFullName = app.fullName || `${app.onboardingDetails?.firstName || ''} ${app.onboardingDetails?.lastName || ''}`.trim() || 'Applicant';
            const signName = app.contractSignName || computedFullName;
            const signDate = app.contractAcceptedAt
                ? new Date(app.contractAcceptedAt).toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' })
                : 'Unknown';

            // Signature image HTML
            const sigImgHtml = app.contractSignature
                ? `<img src="${app.contractSignature}" style="display:block; max-height:70px; border:1px solid #ccc; padding:5px; background:#fff; margin-top:6px; border-radius:3px;">`
                : `<span style="font-size:12px; color:#888; font-style:italic;">No digital signature image on file.</span>`;

            // Build populated contract body
            let populatedBody = '';
            if (contractContent) {
                // 1. Replace all merge fields (returns text with __SIG_IMG__ sentinel)
                let merged = populateContract(contractContent, app);
                // 2. Convert newlines to <br> for HTML rendering
                merged = merged.replace(/\n/g, '<br>');
                // 3. Swap sentinel for actual signature image HTML
                merged = merged.replace(/__SIG_IMG__/g, sigImgHtml);
                populatedBody = `<div class="contract-body" style="font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:1.65; color:#111;">${merged}</div>`;
            } else {
                populatedBody = `<div style="color:#888; font-style:italic; font-family:Arial,sans-serif; font-size:13px; padding:20px 0;">Contract text unavailable — no template stored for this role.</div>`;
            }

            const noContractHtml = !contractContent
                ? `<div style="background:#fff3cd; border:1px solid #ffc107; color:#856404; padding:12px 16px; border-radius:6px; margin-bottom:20px; font-size:13px; font-family:Arial,sans-serif;">
                    ⚠️ No matching contract template found in <strong>NGU Contracts &amp; Policies</strong> for the role <strong>"${escapeHtml(position)}"</strong>.
                    The signature record is still shown below.
                  </div>` : '';

            const overlay = document.createElement('div');
            overlay.id = 'contractOverlay';
            overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:center; justify-content:center; padding:30px;';

            const approvedLine = app.contractApproved
                ? `<div style="margin-top:10px; font-size:12px; color:#065f46; font-weight:700;">✔ Contract approved by ${escapeHtml(app.contractApprovedBy || 'NGU')} on ${escapeHtml(fmtStampDate(app.contractApprovedAt))}</div>`
                : '';

            overlay.innerHTML = `
                <div class="contract-sheet" style="background:#fff; color:#111; max-width:860px; width:100%; max-height:92vh; overflow-y:auto; border-radius:8px;">
                    <div class="contract-toolbar" style="position:sticky; top:0; background:#fff; padding:14px 24px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center; gap:10px; z-index:10;">
                        <div style="font-family:Arial,sans-serif; font-size:13px; font-weight:700; color:#333;">📄 Signed Employment Contract — ${escapeHtml(computedFullName)}</div>
                        <div style="display:flex; gap:10px;">
                            <button id="contractPrintBtn" style="background:#005EB8; color:#fff; border:none; padding:8px 16px; border-radius:5px; font-size:13px; cursor:pointer; font-weight:600;">🖨 Print / Save as PDF</button>
                            <button id="contractCloseBtn" style="background:#666; color:#fff; border:none; padding:8px 16px; border-radius:5px; font-size:13px; cursor:pointer; font-weight:600;">✕ Close</button>
                        </div>
                    </div>

                    <table class="lh-table" style="width:100%; border-collapse:collapse;">
                    <thead><tr><td style="padding:0;">${letterheadHeaderHtml()}</td></tr></thead>
                    <tfoot><tr><td style="padding:0;">${letterheadFooterHtml()}</td></tr></tfoot>
                    <tbody><tr><td style="padding:0;">
                    <div class="lh-body" style="padding:28px 50px 30px;">
                        ${noContractHtml}
                        ${populatedBody}

                        ${contractContent ? `
                        <div style="margin-top:32px; border-top:2px solid #000; padding-top:18px; font-family:Arial,sans-serif;">
                            <div style="background:#e6f9f0; border:1px solid #10B981; border-radius:4px; padding:10px 16px; font-size:12px; color:#065f46; font-weight:700; display:inline-block;">
                                ✅ Digitally accepted via NGU Onboarding Portal on ${escapeHtml(signDate)}
                            </div>
                            ${approvedLine}
                        </div>` : ''}
                    </div>

                    </td></tr></tbody></table>
                </div>`;

            // The old separate signature section is no longer needed — it's now inline
            // inside the contract body at {{declaration.signature}} / {{declaration.date}}

            document.body.appendChild(overlay);
            overlay.querySelector('#contractPrintBtn').addEventListener('click', () => window.print());
            overlay.querySelector('#contractCloseBtn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

        } catch (err) {
            console.error('Contract fetch error:', err);
            document.getElementById('contractOverlay')?.remove();
            alert('Failed to load contract. Please check your connection and try again.');
        }
    };

    // ---------- HMRC Starter Checklist generator ----------
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function fmtDateDMY(val) {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d.getTime())) return escapeHtml(val);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function box(label, checked) {
        return `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:18px;">
            <span style="display:inline-block;width:14px;height:14px;border:1.5px solid #000;text-align:center;line-height:13px;font-size:11px;font-weight:bold;">${checked ? 'X' : ''}</span>
            ${label}
        </span>`;
    }

    function renderDetails(app) {

        const ec = app.emergencyContact || {};
        const uni = app.uniformData || {};
        const hmrc = app.hmrcChecklist || {};
        const docs = app.onboardingDocs || {};
        
        const computedFullName = app.fullName || `${pNew.firstName || pOriginal.forename || ''} ${pNew.lastName || pOriginal.surname || ''}`.trim() || 'Applicant';
        const formatStart = app.startDate ? new Date(app.startDate).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';

        const fmtShortDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'N/A';
        const reissuePendingHtml = (app.contractAccepted === false && app.contractReissuedAt)
            ? `<div class="reissue-pending">⏳ Contract reissued ${new Date(app.contractReissuedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}${app.contractReissuedBy ? ' by ' + escapeHtml(app.contractReissuedBy) : ''} — awaiting the candidate's new signature (start date ${fmtShortDate(app.startDate)}).
                <div style="margin-top:0.6rem; display:flex; flex-wrap:wrap; gap:0.8rem; align-items:center; font-weight:500;">
                    <span>${app.contractReissueEmail

                            : `❌ Last email attempt failed: ${escapeHtml(app.contractReissueEmail.error || 'unknown error')}`)

                            · superseded ${new Date(h.supersededAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}${h.supersededBy ? ' by ' + escapeHtml(h.supersededBy) : ''}

        let warningBanner = '';

            warningBanner = `<div class="banner-warning">⚠️ The applicant has accepted their contract but has NOT submitted their final onboarding data form yet. Pending fields will populate once they complete the workflow.</div>`;
        }

        }

        // Documents HTML

            Object.keys(docs).forEach(key => {

        } else {
            docsHtml = `<div class="missing-data">No documents uploaded yet.</div>`;
        }

        // Certificates HTML
        let certsHtml = '';
        const c = app.certificates || {};
        [
            { key: 'mocopa',       label: 'MOCOPA' },
            { key: 'gasl3',        label: 'Level 3 Gas' },
            { key: 'cmagas',       label: 'CMA Gas' },
            { key: 'met1',         label: 'MET1' },
            { key: 'higherskills', label: 'Higher Skills' },
            { key: 'passport',     label: 'Passport / ID' },

                                    <option value="verified" ${status==='verified'?'selected':''}>✓ Verified</option>
                                    <option value="under_review" ${status==='under_review'?'selected':''}>⏳ Under Review</option>
                                    <option value="rejected" ${status==='rejected'?'selected':''}>✗ Rejected</option>

        if (c.additional && c.additional.length > 0) {

                    let replaceSection = '';
                    if (status === 'rejected') {

                            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; width: 100%;">

                                        <option value="">— Verification Status —</option>
                                        <option value="verified" ${status==='verified'?'selected':''}>✓ Verified</option>
                                        <option value="under_review" ${status==='under_review'?'selected':''}>⏳ Under Review</option>
                                        <option value="rejected" ${status==='rejected'?'selected':''}>✗ Rejected</option>

        if (!certsHtml) certsHtml = `<div class="missing-data">No certificates uploaded during application.</div>`;

                        <button type="button" onclick="lockPayroll('${app.id}')" style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:4px 10px; border-radius:6px; font-size:0.8rem; cursor:pointer;">🔒 Lock Section</button>

        } else {

                    </div>

    // ─── DOCUMENT STAMPS ─────────────────────────────────────────────────────
    function fmtStampDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return isNaN(d.getTime()) ? '' : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    // "✓ Verified by <name> · <date time>" under a document
    function docStampHtml(f) {
        if (!f || !f.docStatus || !f.docStatusAt) return '';
        const who = escapeHtml(f.docStatusBy || 'Unknown');
        const when = fmtStampDate(f.docStatusAt);
        if (f.docStatus === 'verified') return `<small class="doc-stamp ok">✓ Verified by ${who} · ${when}</small>`;
        if (f.docStatus === 'rejected') return `<small class="doc-stamp bad">✗ Rejected by ${who} · ${when}${f.docRejectReason ? ' — ' + escapeHtml(f.docRejectReason) : ''}</small>`;
        return `<small class="doc-stamp">⏳ Set to under review by ${who} · ${when}</small>`;
    }

    // ─── REJECTED DOCUMENTS EMAIL ────────────────────────────────────────────
    // Emails the applicant a list of everything currently rejected, with a link to
    // docupload2.html which only shows the rejected items. Records the outcome.
    async function sendRejectedDocsEmail(appId, rejectedMap) {
        const appData = applicationsData.find(a => a.id === appId) || {};
        const toEmail = appData.personalDetails?.email || appData.onboardingDetails?.personalEmail || '';
        const firstName = (appData.fullName || '').split(' ')[0] || 'there';
        const items = Object.keys(rejectedMap || {}).map(k => rejectedMap[k]);
        let result = { ok: false, error: '' };

        if (!window.emailjs) result.error = 'EmailJS has not loaded on this page.';
        else if (!toEmail) result.error = 'This applicant has no email address on file.';
        else if (items.length === 0) result.error = 'There are no rejected documents to send.';
        else {
            const base = location.origin.startsWith('file') ? PORTAL_BASE : location.origin;
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_DOCS_REJECTED, {
                    to_email: toEmail,
                    first_name: firstName,
                    job_title: appData.position || 'the role',
                    rejected_items: '<ul style="margin:0; padding-left:20px;">' + items.map(i => `<li style="margin-bottom:8px;"><strong>${escapeHtml(i.label)}</strong><br><span style="color:#b91c1c;">${escapeHtml(i.reason || '')}</span></li>`).join('') + '</ul>',
                    rejected_items_text: items.map(i => `- ${i.label}: ${i.reason || ''}`).join('\n'),
                    upload_link: `${base}/docupload2.html?email=${encodeURIComponent(toEmail)}`
                }, { publicKey: EMAILJS_PUBLIC_KEY });
                result.ok = true;
            } catch (err) {
                console.error('Rejected-documents email failed:', err);
                result.error = (err && (err.text || err.message)) ? `EmailJS error ${err.status || ''}: ${err.text || err.message}` : String(err);
            }
        }
        try {
            await updateDoc(doc(db, 'NGUO New Applicants', appId), {
                docRejectionEmail: { status: result.ok ? 'sent' : 'failed', at: new Date().toISOString(), to: toEmail, error: result.error || '' }
            });
        } catch (e) { console.error('Could not record rejection email outcome:', e); }
        return result;
    }

    window.resendRejectedDocsEmail = async function(appId) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return;
        const r = await sendRejectedDocsEmail(appId, appData.rejectedDocuments || {});
        alert(r.ok ? 'Email sent to the applicant.' : 'Email NOT sent:\n' + r.error);
    };

    // ─── RIGHT TO WORK SHARE-CODE CHECK ──────────────────────────────────────
    window.updateShareCodeCheck = async function(appId, statusValue) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return;
        const nowIso = new Date().toISOString();
        const by = currentUserName();
        const updates = {};
        let rejectInfo = null;

        if (statusValue) {
            updates['rightToWork.shareCodeCheck'] = { docStatus: statusValue, docStatusBy: by, docStatusAt: nowIso };
        } else {
            updates['rightToWork.shareCodeCheck'] = deleteField();
        }
        if (statusValue === 'rejected') {
            const input = prompt('Rejecting the right to work share code.\n\nEnter the reason (it is emailed to the applicant straight away so they can send a new code):', '');
            if (input === null) { renderDetails(appData); return; }
            const reason = input.trim() || 'We could not verify this share code. Please provide a new, valid share code.';
            updates['rightToWork.shareCodeCheck'].docRejectReason = reason;
            rejectInfo = { label: DOC_LABELS.sharecode, reason, store: 'rightToWork', at: nowIso, by };
            updates['rejectedDocuments.sharecode'] = rejectInfo;
        } else {
            updates['rejectedDocuments.sharecode'] = deleteField();
        }
        try { await updateDoc(doc(db, 'NGUO New Applicants', appId), updates); }
        catch (e) { console.error(e); alert('Could not save the share code check.'); renderDetails(appData); return; }

        if (rejectInfo) {
            const r = await sendRejectedDocsEmail(appId, { ...(appData.rejectedDocuments || {}), sharecode: rejectInfo });
            alert(r.ok ? 'Marked as rejected and the applicant has been emailed.' : 'Marked as rejected, but the email was NOT sent:\n' + r.error + '\n\nUse "Resend email" once fixed.');
        }
    };

        try {
            await updateDoc(doc(db, 'NGUO New Applicants', appId), {
                contractApproved: false,
                contractApprovedAt: deleteField(),
                contractApprovedBy: deleteField(),
                contractApprovalNote: deleteField()
            });
        } catch (e) { console.error(e); alert('Could not remove the approval.'); }
    };

    // ─── ARCHIVE: LEAVER / DID NOT START ─────────────────────────────────────
    window.archiveOnboarding = async function(appId, status) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return;
        const date = document.getElementById('archiveDate')?.value || '';
        const reason = (document.getElementById('archiveReason')?.value || '').trim();
        if (!confirm(`Move ${appData.fullName || 'this person'} out of the main list and into the Archive as "${status}"?\n\nYou can restore them from the Archive tab at any time.`)) return;
        try {
            await updateDoc(doc(db, 'NGUO New Applicants', appId), {
                onboardingArchive: { status, at: new Date().toISOString(), by: currentUserName(), date, reason }
            });
            selectedAppId = null;
            document.getElementById('mainContent').innerHTML = `<div class="empty-state">${escapeHtml(appData.fullName || 'Applicant')} moved to the Archive (${status}).</div>`;
        } catch (e) { console.error(e); alert('Could not archive this person. Please try again.'); }
    };

    window.restoreOnboarding = async function(appId) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!confirm(`Restore ${appData?.fullName || 'this person'} to the main list?`)) return;
        try {
            await updateDoc(doc(db, 'NGUO New Applicants', appId), { onboardingArchive: deleteField() });
            selectedAppId = null;
            currentTab = 'active';
            renderSidebar();
            document.getElementById('mainContent').innerHTML = `<div class="empty-state">Restored to the main list.</div>`;
        } catch (e) { console.error(e); alert('Could not restore this person.'); }
    };

    // ─── DOCUMENT STATUS UPDATES ─────────────────────────────────────────────
    // Sets Verified / Under Review / Rejected on a document, stamping who did it and when.
    // Rejecting asks for a reason, records it, and automatically emails the applicant.
    window.updateOnboardingDocStatus = async function(appId, fieldPath, statusValue) {
        const appData = applicationsData.find(a => a.id === appId);
        if (!appData) return;
        const parts = fieldPath.split('.');           // e.g. ['onboardingDocs', 'passport', 'docStatus']
        const store = parts[0], key = parts[1];
        const base = `${store}.${key}`;
        const label = DOC_LABELS[key] || key;
        const nowIso = new Date().toISOString();
        const by = currentUserName();
        const updates = {};
        let rejectInfo = null;

        updates[`${base}.docStatus`] = statusValue;
        if (statusValue) {
            updates[`${base}.docStatusBy`] = by;
            updates[`${base}.docStatusAt`] = nowIso;
        } else {
            updates[`${base}.docStatusBy`] = deleteField();
            updates[`${base}.docStatusAt`] = deleteField();
        }

        if (statusValue === 'rejected') {
            const input = prompt(`Rejecting "${label}".\n\nEnter the reason. The applicant is emailed straight away, listing everything that has been rejected, with a link to upload replacements:`, '');
            if (input === null) { renderDetails(appData); return; }   // cancelled — put the dropdown back
            const reason = input.trim() || DEFAULT_REJECT_REASON;
            updates[`${base}.docRejectReason`] = reason;
            rejectInfo = { label, reason, store, at: nowIso, by };
            updates[`rejectedDocuments.${key}`] = rejectInfo;
        } else {
            updates[`${base}.docRejectReason`] = deleteField();
            updates[`rejectedDocuments.${key}`] = deleteField();
        }

        try {
            await updateDoc(doc(db, 'NGUO New Applicants', appId), updates);
        } catch (error) {
            console.error('Failed to update status:', error);
            alert('Error updating document status.');
            renderDetails(appData);
            return;
        }

        if (rejectInfo) {
            const r = await sendRejectedDocsEmail(appId, { ...(appData.rejectedDocuments || {}), [key]: rejectInfo });
            alert(r.ok
                ? `"${label}" rejected. The applicant has been emailed with a link to upload a replacement.`
                : `"${label}" rejected, but the email was NOT sent:\n${r.error}\n\nUse the "Resend email" button on this applicant once that is fixed.`);
        }
    };

    window.updateAdditionalCertStatus = async function(appId, idx, statusValue) {
        try {
            const appRef = doc(db, "NGUO New Applicants", appId);
            const appSnap = await getDoc(appRef);
            if (appSnap.exists()) {
                const data = appSnap.data();
                const certs = data.certificates || {};
                const additional = certs.additional || [];
                if (additional[idx]) {
                    let didDelete = false;
                    if (statusValue === 'rejected' && confirm("Would you like to delete this file entirely so the applicant must re-upload it? (Choosing 'Cancel' keeps the file but marks it rejected)")) {
                        additional.splice(idx, 1);
                        didDelete = true;
                    } else {
                        additional[idx].docStatus = statusValue;
                        additional[idx].docStatusBy = currentUserName();
                        additional[idx].docStatusAt = new Date().toISOString();
                    }
                    await updateDoc(appRef, { "certificates.additional": additional });
                    console.log(`Updated additional cert ${idx} to ${statusValue}`);
                    if (didDelete) {
                        alert("File deleted successfully. The applicant will now be able to upload a replacement via the upload link.");
                        location.reload();
                    }
                }
            }
        } catch (error) {
            console.error("Failed to update additional cert status:", error);
            alert("Error updating document status.");
        }
    };

    // ─── ADMIN DIRECT REPLACEMENT UPLOADS ──────────────────────────────────────
    window.uploadAdminReplacementDoc = async function(appId, docKey, inputEl) {
        if (inputEl.files.length === 0) return;
        const file = inputEl.files[0];
        const statusSpan = inputEl.previousElementSibling;
        
        statusSpan.textContent = "⏳ Uploading...";
        statusSpan.style.color = "var(--warning)";
        inputEl.disabled = true;

        try {
            const storagePath = `onboarding_docs/${appId}/${docKey}_admin_replace_${Date.now()}_${file.name}`;
            const fileRef = ref(storage, storagePath);
            const uploadTask = uploadBytesResumable(fileRef, file);

            await new Promise((resolve, reject) => {
                uploadTask.on('state_changed', null, (error) => reject(error), () => resolve());
            });

            const downloadUrl = await getDownloadURL(uploadTask.snapshot.ref);

            const appRef = doc(db, "NGUO New Applicants", appId);
            const updates = {};
            updates[`rejectedDocuments.${docKey}`] = deleteField();
            updates[`onboardingDocs.${docKey}`] = {
                url: downloadUrl,
                filename: file.name,
                path: storagePath,
                docStatus: 'under_review' // Reset status to under_review after replacement upload
            };

            await updateDoc(appRef, updates);
            statusSpan.textContent = "✓ Replaced!";
            statusSpan.style.color = "var(--success)";
        } catch (e) {
            console.error(e);
            statusSpan.textContent = "❌ Failed!";
            statusSpan.style.color = "var(--error)";
            inputEl.disabled = false;
        }
    };
